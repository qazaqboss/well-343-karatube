<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subsoil ERP — Управление недропользованием</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg-2:#F8F8F8;--surface:#F4F4F4;--surface-2:#ECECEC;
  --border:#D8D8D8;--border-dim:#EBEBEB;
  --white:#111111;--white-dim:#2A2A2A;--gray:#777777;--grey-dim:#AAAAAA;--grey-muted:#CCCCCC;
  --green:#16A34A;--red:#EF4444;--orange:#D97706;
  --text:#111111;--text2:#2A2A2A;--text3:#777777;
  --accent:#111111;--accent2:#000000;--sidebar:#F8F8F8;
  --font-h:'Oswald',sans-serif;--font-data:'Inter',sans-serif;
  --radius:2px;--shadow:none;
}
body{font-family:var(--font-data);background:var(--bg);color:var(--text);
  display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── Sidebar ── */
#sidebar{width:236px;min-width:236px;background:var(--bg-2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;user-select:none;z-index:10}
.logo{padding:24px 20px 18px;border-bottom:1px solid var(--border)}
.logo-home{display:block;cursor:pointer;transition:opacity .15s}
.logo-home:hover{opacity:.65}
.logo-mark{width:26px;height:26px;border:1.5px solid var(--border);transform:rotate(45deg);
  display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.logo-mark i{width:9px;height:9px;background:var(--white);display:block}
.logo-eyebrow{font-family:var(--font-data);font-size:8.5px;color:var(--grey-dim);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.logo-title{font-family:var(--font-h);font-size:15px;font-weight:400;letter-spacing:4px;
  text-transform:uppercase;color:var(--white)}
.logo-sub{font-family:var(--font-data);font-size:9px;color:var(--gray);
  letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
.logo a:not(.logo-home){font-family:var(--font-data);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--gray);border:1px solid var(--border);border-radius:2px;padding:4px 9px;
  background:var(--bg);transition:.15s}
.logo a:not(.logo-home):hover{border-color:var(--gray);color:var(--white)}
nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section{font-family:var(--font-data);color:var(--grey-dim);font-size:8.5px;font-weight:500;
  letter-spacing:2px;padding:14px 20px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;
  color:var(--gray);font-size:12.5px;cursor:pointer;transition:.15s;
  border-left:2px solid transparent}
.nav-item:hover{background:var(--bg);color:var(--white)}
.nav-item.active{background:var(--bg);color:var(--white);border-left-color:var(--white);font-weight:600}
.nav-item .icon{display:none}

.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border)}
.sidebar-footer small{font-family:var(--font-data);color:var(--grey-dim);font-size:9px;
  letter-spacing:1.5px;text-transform:uppercase}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--bg);border-bottom:1px solid var(--border);
  padding:0 28px;height:60px;display:flex;align-items:center;gap:12px}
#topbar h1{font-family:var(--font-h);font-size:19px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;flex:1}
.btn-home{flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:2px;white-space:nowrap;
  font-family:var(--font-data);font-size:11px;font-weight:500;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--white);color:#fff;border-color:var(--white)}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--bg);color:var(--gray);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--gray);color:var(--white)}
.btn-danger{background:var(--bg);color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:10px}
#content{flex:1;overflow-y:auto;padding:28px}

/* ── Cards / KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);margin-bottom:28px}
.kpi{background:var(--bg);padding:22px 24px;border-left:none}
.kpi.red .kpi-val{color:var(--red)}
.kpi.green .kpi-val{color:var(--white)}
.kpi.orange .kpi-val{color:var(--white)}
.kpi-val{font-family:var(--font-h);font-size:38px;font-weight:700;line-height:1}
.kpi-label{font-family:var(--font-data);font-size:9px;color:var(--grey-dim);margin-top:8px;
  letter-spacing:2px;text-transform:uppercase}

/* ── Tables ── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-bottom:22px}
.card-header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;background:var(--bg-2)}
.card-title{font-family:var(--font-h);font-size:13px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--surface);padding:10px 14px;text-align:left;font-family:var(--font-data);
  font-size:9px;font-weight:500;color:var(--grey-dim);letter-spacing:1.5px;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border-dim);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-2)}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:2px;
  font-family:var(--font-data);font-size:10.5px;font-weight:500;white-space:nowrap;
  border:1px solid var(--border);background:var(--bg);color:var(--white-dim)}
.tag-green{border-color:rgba(22,163,74,.4);color:var(--green)}
.tag-red{border-color:rgba(239,68,68,.4);color:var(--red)}
.tag-orange{border-color:rgba(217,119,6,.4);color:var(--orange)}
.tag-blue{border-color:var(--border);color:var(--white-dim);background:var(--surface)}
.tag-gray{border-color:var(--border-dim);color:var(--gray)}

/* ── Stage bar ── */
.stage-bar{display:flex;margin:16px 0 6px;gap:2px}
.stage-seg{flex:1;height:5px;background:var(--surface-2)}
.stage-seg.done{background:var(--grey-dim)}
.stage-seg.active{background:var(--white)}
.stage-seg.pending{background:var(--surface-2)}
.stage-labels{display:flex;gap:2px;font-family:var(--font-data);font-size:8.5px;
  color:var(--grey-dim);letter-spacing:.5px;text-transform:uppercase}
.stage-labels span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}

/* ── Tabs ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 18px;background:var(--bg-2)}
.tab{padding:12px 16px;font-family:var(--font-data);font-size:11px;font-weight:500;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--white)}
.tab.active{color:var(--white);border-bottom-color:var(--white)}
.tab-pane{display:none;padding:22px 18px}
.tab-pane.active{display:block}

/* ── Detail grid ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-dim);
  border:1px solid var(--border-dim);margin-bottom:18px}
.detail-row{display:flex;flex-direction:column;gap:3px;background:var(--bg);padding:12px 14px}
.detail-label{font-family:var(--font-data);font-size:9px;color:var(--grey-dim);
  letter-spacing:1.5px;text-transform:uppercase}
.detail-val{font-size:12.5px;font-weight:500;color:var(--white-dim)}
.info-box{background:var(--bg-2);border:1px solid var(--border-dim);padding:14px 16px;
  margin-bottom:12px;font-size:12.5px;line-height:1.6;color:var(--white-dim)}

/* ── Risk dots ── */
.risk{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-data);
  font-size:11.5px;font-weight:500}
.risk::before{content:'';width:7px;height:7px;border-radius:50%;display:inline-block}
.risk.critical::before{background:var(--red)} .risk.critical{color:var(--red)}
.risk.high::before{background:var(--orange)} .risk.high{color:var(--orange)}
.risk.medium::before{background:var(--grey-dim)} .risk.medium{color:var(--gray)}
.risk.low::before{background:var(--green)} .risk.low{color:var(--green)}

/* ── Calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:12px;
  background:var(--border-dim);border:1px solid var(--border-dim)}
.cal-head{font-family:var(--font-data);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  font-weight:500;text-align:center;padding:9px;color:var(--grey-dim);background:var(--bg-2)}
.cal-day{min-height:76px;padding:5px 7px;background:var(--bg)}
.cal-day.today{background:var(--surface);box-shadow:inset 0 0 0 1px var(--white)}
.cal-day.other-month{opacity:.35}
.cal-dn{font-family:var(--font-h);font-size:12px;font-weight:600;margin-bottom:4px;color:var(--white-dim)}
.cal-ev{font-family:var(--font-data);font-size:9.5px;padding:2px 5px;margin-bottom:2px;
  border-left:2px solid var(--grey-dim);background:var(--bg-2);color:var(--white-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-ev.critical{border-left-color:var(--red);color:var(--red)}
.cal-ev.high{border-left-color:var(--orange);color:var(--orange)}
.cal-ev.medium{border-left-color:var(--grey-dim)}
.cal-ev.low{border-left-color:var(--green);color:var(--green)}

/* ── AI Chat ── */
#chat-box{display:flex;flex-direction:column;height:calc(100vh - 148px);background:var(--bg)}
#chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:11px 15px;font-size:12.5px;line-height:1.65;border-radius:2px}
.msg.user{background:var(--white);color:#fff;align-self:flex-end}
.msg.ai{background:var(--bg);border:1px solid var(--border);align-self:flex-start;
  white-space:pre-wrap;color:var(--white-dim)}
.msg.ai.loading::after{content:'...';animation:dots 1s infinite}
@keyframes dots{0%{content:'.'} 33%{content:'..'} 66%{content:'...'}}
#chat-input-row{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--border);
  background:var(--bg-2)}
#chat-input{flex:1;border:1px solid var(--border);border-radius:2px;padding:10px 13px;
  font-family:var(--font-data);font-size:12.5px;outline:none;resize:none;background:var(--bg)}
#chat-input:focus{border-color:var(--white)}

/* ── Forms ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,17,17,.45);
  z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px;width:520px;max-height:90vh;overflow-y:auto}
.modal h2{font-family:var(--font-h);font-size:17px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:20px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-family:var(--font-data);font-size:9px;font-weight:500;
  color:var(--grey-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--border);
  border-radius:2px;padding:9px 11px;font-family:var(--font-data);font-size:12.5px;
  outline:none;background:var(--bg);color:var(--text)}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--white)}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* ── Util ── */
.row{display:flex;align-items:center;gap:8px}
.flex1{flex:1} .mt8{margin-top:8px} .mb16{margin-bottom:16px}
.section-title{font-family:var(--font-h);font-size:13px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.empty{color:var(--grey-dim);font-family:var(--font-data);font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;text-align:center;padding:28px}
.law-ref{display:inline-flex;align-items:center;padding:2px 7px;background:var(--surface);
  border:1px solid var(--border);border-radius:2px;font-family:var(--font-data);
  font-size:9.5px;color:var(--gray);margin:2px}
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<div id="sidebar">
  <div class="logo">
    <a href="/" title="На главную" class="logo-home">
      <div class="logo-mark"><i></i></div>
      <div class="logo-eyebrow">Месторождение Каратюбе</div>
      <div class="logo-title">IC Petroleum</div>
    </a>
    <div class="logo-sub">ERP · Недропользование</div>
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
      <a href="/">Фонд</a>
      <a href="/stages.html">Этапы</a>
      <a href="/ai">AI</a>
    </div>
  </div>
  <nav>
    <div class="nav-section">Обзор</div>
    <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard">
      <span class="icon">📊</span> Дашборд
    </div>
    <div class="nav-section">Портфель</div>
    <div class="nav-item" onclick="nav('contracts')" id="nav-contracts">
      <span class="icon">📋</span> Лицензии / Контракты
    </div>
    <div class="nav-item" onclick="nav('wells')" id="nav-wells">
      <span class="icon">🔩</span> Скважины
    </div>
    <div class="nav-section">Контроль</div>
    <div class="nav-item" onclick="nav('deadlines')" id="nav-deadlines">
      <span class="icon">⏰</span> Дедлайны
    </div>
    <div class="nav-item" onclick="nav('calendar')" id="nav-calendar">
      <span class="icon">📅</span> Календарь
    </div>
    <div class="nav-section">Отчёты</div>
    <div class="nav-item" onclick="nav('reports')" id="nav-reports">
      <span class="icon">📄</span> Отчёты по этапам
    </div>
    <div class="nav-section">AI</div>
    <div class="nav-item" onclick="nav('ai')" id="nav-ai">
      <span class="icon">🤖</span> AI Помощник
    </div>
  </nav>
  <div class="sidebar-footer">
    <small>ERP v1.0 · ТОО «ЭкоМикс»</small>
  </div>
</div>

<!-- ── Main ── -->
<div id="main">
  <div id="topbar">
    <a href="/" class="btn btn-ghost btn-home" title="Вернуться на сайт">&#8592; На главную</a>
    <h1 id="page-title">Дашборд</h1>
    <div id="topbar-actions"></div>
  </div>
  <div id="content">
    <!-- Pages rendered here by JS -->
  </div>
</div>

<!-- ── Add Contract Modal ── -->
<div class="modal-overlay" id="modal-contract">
  <div class="modal">
    <h2>Новый контракт / лицензия</h2>
    <div class="form-row"><label>Номер контракта *</label>
      <input id="f-number" placeholder="КЗ-2025-XXX"></div>
    <div class="form-row"><label>Компания *</label>
      <input id="f-company" placeholder="ООО «Пример»"></div>
    <div class="form-row"><label>Территория / блок</label>
      <input id="f-territory" placeholder="Блок Жазык"></div>
    <div class="form-row"><label>Регион</label>
      <input id="f-region" placeholder="Актюбинская обл."></div>
    <div class="form-row"><label>Тип контракта</label>
      <select id="f-ctype">
        <option value="standard">Стандартный</option>
        <option value="complex">Сложный (>100 млн т)</option>
      </select></div>
    <div class="form-row"><label>Текущий этап</label>
      <select id="f-stage">
        <option value="1">1 — Разведка</option>
        <option value="2">2 — Оценка</option>
        <option value="3">3 — Гос. Баланс</option>
        <option value="4">4 — Подготовительный</option>
        <option value="5">5 — Полномасштабная добыча</option>
        <option value="6">6 — Ликвидация</option>
        <option value="7">7 — Сдача территории</option>
      </select></div>
    <div class="form-row"><label>Дата начала</label>
      <input type="date" id="f-start"></div>
    <div class="form-row"><label>Дата окончания</label>
      <input type="date" id="f-end"></div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-contract')">Отмена</button>
      <button class="btn btn-primary" onclick="submitContract()">Создать</button>
    </div>
  </div>
</div>

<!-- ── Add Well Modal ── -->
<div class="modal-overlay" id="modal-well">
  <div class="modal">
    <h2>Новая скважина</h2>
    <input type="hidden" id="wf-contract-id">
    <div class="form-row"><label>Номер скважины *</label>
      <input id="wf-number" placeholder="ЖЗ-4"></div>
    <div class="form-row"><label>Тип скважины</label>
      <select id="wf-type">
        <option>поисковая</option><option>оценочная</option>
        <option>опережающе-добывающая</option><option>добывающая</option>
        <option>нагнетательная</option><option>наблюдательная</option>
        <option>ликвидационная</option>
      </select></div>
    <div class="form-row"><label>Категория запасов</label>
      <select id="wf-cat"><option>C2</option><option>C1</option>
        <option>B</option><option>A</option></select></div>
    <div class="form-row"><label>Глубина, м</label>
      <input type="number" id="wf-depth" placeholder="3000"></div>
    <div class="form-row"><label>Дата забуривания</label>
      <input type="date" id="wf-spud"></div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-well')">Отмена</button>
      <button class="btn btn-primary" onclick="submitWell()">Создать</button>
    </div>
  </div>
</div>

<script>
const API = '';  // same origin
let currentPage = '';
let currentContract = null;
let currentWell = null;
let aiHistory = [];

const STAGE_NAMES = {
  1:'Разведка',2:'Оценка',3:'Гос. Баланс',
  4:'Подготовительный',5:'Полномасштабная добыча',
  6:'Ликвидация',7:'Сдача территории'
};

async function apiFetch(url, opts={}) {
  const r = await fetch(API + url, {
    headers:{'Content-Type':'application/json'}, ...opts
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Router ────────────────────────────────────────────────────────────────────
function nav(page, data=null) {
  // Раздел пишем в адрес: /erp/#wells открывается сразу на скважинах
  if (!data && location.hash.slice(1) !== page) {
    history.replaceState(null, '', '#' + page);
  }
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const ni = document.getElementById('nav-' + page);
  if (ni) ni.classList.add('active');
  currentPage = page;
  if (data) {
    if (page === 'contract-detail') currentContract = data;
    if (page === 'well-detail') currentWell = data;
  }
  renderPage(page);
}

function renderPage(page) {
  const content = document.getElementById('content');
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = '';
  const titles = {
    dashboard:'Дашборд', contracts:'Лицензии и Контракты',
    wells:'Скважины', deadlines:'Реестр дедлайнов',
    calendar:'Календарь', reports:'Отчёты по этапам',
    ai:'AI Помощник', 'contract-detail':'Контракт',
    'well-detail':'Паспорт скважины'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  content.innerHTML = '<div style="color:#999;padding:20px">Загрузка...</div>';

  switch (page) {
    case 'dashboard':       renderDashboard(); break;
    case 'contracts':       renderContracts(); break;
    case 'contract-detail': renderContractDetail(currentContract); break;
    case 'wells':           renderWells(); break;
    case 'well-detail':     renderWellDetail(currentWell); break;
    case 'deadlines':       renderDeadlines(); break;
    case 'calendar':        renderCalendar(); break;
    case 'reports':         renderReports(); break;
    case 'ai':              renderAI(); break;
  }
}

// ── Dashboard ──────────────────────────────────────────────────────────────────
async function renderDashboard() {
  const d = await apiFetch('/api/dashboard');
  const content = document.getElementById('content');
  content.innerHTML = `
  <div class="kpi-grid">

          <td style="font-size:11px;color:var(--gray)">${dl.law_ref||'—'}</td>
          <td>${statusTag(dl.status)}</td>
          <td>${dl.status!=='completed'?`<button class="btn btn-ghost btn-sm" onclick="completeDl(${dl.id},true)">✓</button>`:''}
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

// ── Calendar ─────────────────────────────────────────────────────────────────
async function renderCalendar() {
  const data = await apiFetch('/api/deadlines?days=60');
  const today = new Date();
  const year = today.getFullYear(), month = today.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                      'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  // Map deadlines by day
  const evMap = {};
  data.forEach(dl => {
    const d = dl.due_date.split('T')[0];
    if (!evMap[d]) evMap[d] = [];
    evMap[d].push(dl);
  });

  let cells = '';
  const offset = (firstDay + 6) % 7;
  for (let i=0; i<offset; i++) cells += `<div class="cal-day other-month"></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d===today.getDate();
    const evs = evMap[ds]||[];
    cells += `<div class="cal-day${isToday?' today':''}">
      <div class="cal-dn">${d}</div>
      ${evs.map(e=>`<div class="cal-ev ${e.risk_level}" title="${e.obligation} · ${e.company}">${e.obligation.substring(0,22)}</div>`).join('')}
    </div>`;
  }

  document.getElementById('content').innerHTML = `
  <div class="card" style="margin-bottom:16px;padding:14px 18px;background:var(--bg-2)">
    <div style="font-family:var(--font-h);font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase">${monthNames[month]} ${year}</div>
  </div>
  <div class="card">
    <div class="cal-grid">
      ${dayNames.map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>`;
}

// ── AI Chat ───────────────────────────────────────────────────────────────────
function renderAI() {
  document.getElementById('content').innerHTML = `
  <div class="card" style="height:calc(100vh - 130px);display:flex;flex-direction:column">
    <div class="card-header">
      <span class="card-title">AI Помощник недропользователя</span>
      <div style="font-size:12px;color:var(--gray)">КОНН РК · ЭК РК · ЕПРКИН · Приказы МЭ/МИИР</div>
    </div>
    <div id="chat-messages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div class="msg ai">Здравствуйте! Я AI-помощник по недропользованию РК.
Могу ответить на вопросы по 7 этапам, нормативным актам (КОНН РК, ЭК РК, ЕПРКИН),
паспортам скважин, дедлайнам и управленческому учёту.

Примеры вопросов:
• Какие документы нужны на этапе оценки?
• Кто утверждает паспорт скважины?
• Что такое коммерческое обнаружение?
• Когда нужен пересчёт запасов?</div>
    </div>
    <div id="chat-input-row" style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)">
      <textarea id="chat-input" placeholder="Введите вопрос... (Enter — отправить, Shift+Enter — перенос строки)"
        style="flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 12px;
               font-size:13px;outline:none;resize:none;height:44px;font-family:inherit"
        onkeydown="chatKeydown(event)"></textarea>
      <button class="btn btn-primary" onclick="sendChat()" id="send-btn">Отправить</button>
    </div>
  </div>`;
}

function chatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML += `<div class="msg user">${escapeHtml(msg)}</div>`;
  const loadingEl = document.createElement('div');
  loadingEl.className = 'msg ai loading';
  loadingEl.textContent = 'Думаю';
  msgs.appendChild(loadingEl);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const resp = await apiFetch('/api/chat', {
      method:'POST',
      body: JSON.stringify({message:msg, history:aiHistory})
    });
    loadingEl.remove();
    aiHistory.push({role:'user',content:msg});
    aiHistory.push({role:'assistant',content:resp.answer});
    if (aiHistory.length > 20) aiHistory = aiHistory.slice(-20);
    msgs.innerHTML += `<div class="msg ai">${escapeHtml(resp.answer)}</div>`;
  } catch(e) {
    loadingEl.remove();
    msgs.innerHTML += `<div class="msg ai" style="color:var(--red)">Ошибка: ${e.message}</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

}

// ── Helpers ───────────────────────────────────────────────────────────────────
function switchTab(el, tabId) {
  el.closest('.card').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.closest('.card').querySelectorAll('.tab-pane').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function fmtMoney(n) {
  if (!n) return '0';
  return new Intl.NumberFormat('ru-RU').format(n);
}

function isOverdue(d) {
  if (!d) return false;
  return new Date(d) < new Date();
}

function stageBar(current) {
  return [1,2,3,4,5,6,7].map(n=>{
    const cls = n < current ? 'done' : n === current ? 'active' : 'pending';
    return `<div class="stage-seg ${cls}"></div>`;
  }).join('');
}

function stageColor(status) {
  return {completed:var_('--green'),active:var_('--accent'),pending:'#d1d5db'}[status]||'#d1d5db';
}

function var_(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function statusTag(s) {
  const map = {
    active:   ['tag-green','Активный'],
    completed:['tag-green','Выполнен'],
    approved: ['tag-green','Утверждён'],
    submitted:['tag-blue', 'Подан'],
    pending:  ['tag-orange','В работе'],
    draft:    ['tag-gray', 'Черновик'],
    suspended:['tag-orange','Приостановлен'],
    overdue:  ['tag-red',  'Просрочен'],
    rejected: ['tag-red',  'Отклонён'],
  };
  const [cls, label] = map[s] || ['tag-gray', s||'—'];
  return `<span class="tag ${cls}">${label}</span>`;
}

function passportTag(s) {
  if (!s) return statusTag('draft');
  return statusTag(s);
}

function riskLabel(r) {
  return {critical:'Критический',high:'Высокий',medium:'Средний',low:'Низкий'}[r]||r;
}

function docTypeLabel(t) {
  return {project:'Проект',passport:'Паспорт',report:'Отчёт',
          geological:'Геол. отчёт',act:'Акт'}[t]||t;
}

function parseLawRefs(refs) {
  try {
    const arr = typeof refs === 'string' ? JSON.parse(refs) : (refs||[]);
    return arr.map(r=>`<span class="law-ref">${r}</span>`).join('');
  } catch { return refs||''; }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target===el) el.classList.remove('open'); });
});

// ── Init ──────────────────────────────────────────────────────────────────────
const ROUTES = ['dashboard','contracts','wells','deadlines','calendar','reports','ai'];
function routeFromHash() {
  const h = location.hash.slice(1);
  return ROUTES.includes(h) ? h : 'dashboard';
}
nav(routeFromHash());
window.addEventListener('hashchange', () => {
  const r = routeFromHash();
  if (r !== currentPage) nav(r);
});
</script>
