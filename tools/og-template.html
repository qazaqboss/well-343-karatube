<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OG-баннер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FFFFFF;--bg-2:#F8F8F8;--border:#D8D8D8;--border-dim:#EBEBEB;
    --white:#111111;--white-dim:#2A2A2A;--grey:#777777;--grey-dim:#AAAAAA;
    --font-h:'Oswald',sans-serif;--font-data:'Inter',sans-serif;
  }
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);font-family:var(--font-data);color:var(--white);
       display:flex;flex-direction:column;position:relative;-webkit-font-smoothing:antialiased}

  /* водяной знак — как в hero на страницах сайта */
  .mark{position:absolute;right:-30px;top:-70px;font-family:var(--font-h);font-size:340px;
        font-weight:700;color:rgba(0,0,0,.038);line-height:1;letter-spacing:-6px;user-select:none}

  header{display:flex;align-items:center;gap:16px;padding:44px 56px 0;position:relative}
  header .spacer{flex:1}
  .logo-mark{width:34px;height:34px;border:1.5px solid var(--border);transform:rotate(45deg);
             display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .logo-mark i{width:12px;height:12px;background:var(--white);display:block}
  .logo-eyebrow{font-size:11px;color:var(--grey-dim);letter-spacing:3px;text-transform:uppercase}
  .logo-text{font-family:var(--font-h);font-size:19px;font-weight:400;letter-spacing:5px;
             text-transform:uppercase;margin-top:2px}

  main{flex:1;padding:0 56px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .eyebrow{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--grey-dim);margin-bottom:20px}
  h1{font-family:var(--font-h);font-weight:700;line-height:.98;letter-spacing:-1px;
     text-transform:uppercase;font-size:96px}
  h1 .light{font-weight:300;color:var(--grey)}
  .sub{font-size:21px;color:var(--white-dim);line-height:1.45;margin-top:22px;max-width:820px}

  .stats{display:flex;border-top:1px solid var(--border);margin:0 56px}
  .stat{flex:1;padding:26px 0 40px;border-right:1px solid var(--border)}
  .stat:last-child{border-right:none;padding-left:0}
  .stat:not(:first-child){padding-left:28px}
  .stat-k{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--grey-dim)}
  .stat-v{font-family:var(--font-h);font-size:34px;font-weight:700;line-height:1.1;margin-top:8px}

  .domain{font-family:var(--font-h);font-size:20px;letter-spacing:4px;
          text-transform:uppercase;color:var(--white-dim);white-space:nowrap}
</style>
</head>
<body>
  <div class="mark" id="mark">UT-9</div>
  <header>
    <div class="logo-mark"><i></i></div>
    <div>
      <div class="logo-eyebrow">Месторождение Каратюбе</div>
      <div class="logo-text">IC Petroleum</div>
    </div>
    <div class="spacer"></div>
    <div class="domain">nanocem.app</div>
  </header>
  <main>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </main>
  <div class="stats" id="stats"></div>

<script>
// Параметры приходят строкой запроса: ?mark=UT-9&eyebrow=...&title=...&sub=...&stats=k|v;;k|v
const q = new URLSearchParams(location.search);
const set = (id, v) => { if (v !== null) document.getElementById(id).innerHTML = v; };

set('mark', q.get('mark') || 'UT-9');
set('eyebrow', q.get('eyebrow'));
set('title', q.get('title'));
set('sub', q.get('sub'));

const stats = (q.get('stats') || '').split(';;').filter(Boolean).map(pair => {
  const [k, v] = pair.split('|');
  return '<div class="stat"><div class="stat-k">' + k + '</div><div class="stat-v">' + v + '</div></div>';
});
document.getElementById('stats').innerHTML = stats.join('');

// длинный заголовок ужимаем, чтобы не выехал за 630px
const h = document.getElementById('title');
let size = parseInt(q.get('size') || '96', 10);
h.style.fontSize = size + 'px';
while (h.scrollHeight > 250 && size > 52) { size -= 4; h.style.fontSize = size + 'px'; }
</script>
</body>
</html>
